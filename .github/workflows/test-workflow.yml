# .github/workflows/test.yml
name: Tests & Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  # Job 1: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/

  # Job 2: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "postgresql://taskio_ci:taskio_ci_password@127.0.0.1:55433/taskio_canonical_hiring_qa"
      DIRECT_URL: "postgresql://taskio_ci:taskio_ci_password@127.0.0.1:55433/taskio_canonical_hiring_qa"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskio_ci
          POSTGRES_PASSWORD: taskio_ci_password
          POSTGRES_DB: taskio_canonical_hiring_qa
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U taskio_ci -d taskio_canonical_hiring_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize PostgreSQL test schema
        run: npm run db:push

      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: true
          NODE_ENV: test

      - name: Run ATS PostgreSQL integration tests
        shell: bash
        env:
          CI: true
          NODE_ENV: test
        run: |
          npm run test:hiring-process:db -- --reporter=default --reporter=json --outputFile=/tmp/ats-hiring-tests.json

          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(
            fs.readFileSync('/tmp/ats-hiring-tests.json', 'utf8')
          );

          const expected = [
            'hiring-process-transition.test.ts',
            'hiring-process-pilot-writer.test.ts',
            'hiring-process-reconciliation.test.ts',
            'hiring-process-writer-migration.test.ts',
          ];

          const files = report.testResults ?? [];
          const missing = expected.filter(
            (name) => !files.some((file) => file.name.endsWith(name))
          );

          const valid =
            files.length === 4 &&
            missing.length === 0 &&
            report.numTotalTests >= 118 &&
            report.numPassedTests === report.numTotalTests &&
            report.numFailedTests === 0 &&
            report.numPendingTests === 0 &&
            (report.numTodoTests ?? 0) === 0 &&
            files.every((file) => file.status === 'passed');

          console.log('ATS PostgreSQL verification:', {
            files: files.length,
            passed: report.numPassedTests,
            skipped: report.numPendingTests,
            failed: report.numFailedTests,
            missing,
          });

          if (!valid) {
            console.error('ATS PostgreSQL coverage validation failed.');
            process.exit(1);
          }
          NODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/

  # Job 3: Security Tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npm run test:security
        env:
          CI: true

      - name: Upload security test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: test-results/security/

  # Job 4: Performance Tests
  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npm run test:performance
        env:
          CI: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: test-results/performance/

  # Job 5: Code Coverage (informativo — no bloquea el Quality Gate)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true   # No bloquea CI mientras la cobertura crece

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        continue-on-error: true
        env:
          CI: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # Job 6: Lint & Type Check
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

  # Job 7: Dependency Security Audit
  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test

  # Job 8: Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-tests, performance-tests, coverage, lint-and-typecheck]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.security-tests.result }}" != "success" ]]; then
            echo "Security tests failed"
            exit 1
          fi
          if [[ "${{ needs.performance-tests.result }}" != "success" ]]; then
            echo "Performance tests failed"
            exit 1
          fi
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]]; then
            echo "Lint or type check failed"
            exit 1
          fi
          echo "Coverage result: ${{ needs.coverage.result }} (informativo, no bloquea)"
          echo "All quality gates passed ✅"

  # Job 9: Test Report
  test-report:
    name: Publish Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-tests, performance-tests]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Publish test report
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: Test Results
          path: '**/*.xml'
          reporter: java-junit
          fail-on-error: false

# Workflow for nightly full test suite
  nightly-full-suite:
    name: Nightly Full Test Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm run test:all
        env:
          CI: true
          FULL_SUITE: true

      - name: Generate comprehensive report
        run: npm run test:report

      - name: Upload comprehensive results
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: test-results/
